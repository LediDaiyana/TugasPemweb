<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Struktur Organisasi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
text-align:center;
}

.box{
display:inline-block;
padding:10px 20px;
border:2px solid black;
border-radius:6px;
margin:10px;
background:#f8f9fa;
font-weight:bold;
}

.line{
width:2px;
height:40px;
background:black;
margin:auto;
}

.horizontal{
display:flex;
justify-content:center;
gap:40px;
}

</style>

</head>

<body>

<h2 class="mt-4">Struktur Organisasi</h2>

<!-- Kepala Sekolah -->
<div class="box">
<img src="kepsek.jpg" width="80" class="rounded-circle"><br>
<b>Budi Santoso</b><br>
Kepala Sekolah
</div>

<div class="line"></div>

<!-- Wakil -->
<div class="horizontal">
<div class="box">Wakil Kepala</div>
<div class="box">Kepala TU</div>
</div>

<div class="line"></div>

<!-- Guru -->
<div class="horizontal">
<div class="box">Guru</div>
<div class="box">Guru</div>
<div class="box">Guru</div>
</div>

</body>
</html>
